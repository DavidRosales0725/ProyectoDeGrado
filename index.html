<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — TiendaApp SENA</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="login-page">
  <section class="login-panel-left">
    <div class="login-brand"><div class="login-logo">🏪</div><h1>TiendaApp</h1><p>Sistema local de ventas e inventario para tiendas.</p></div>
    <div class="login-features">
      <div class="login-feature"><div class="ft-icon">📦</div>Control de productos e inventario</div>
      <div class="login-feature"><div class="ft-icon">🛒</div>Registro ágil de ventas</div>
      <div class="login-feature"><div class="ft-icon">📊</div>Dashboard y reportes</div>
      <div class="login-feature"><div class="ft-icon">🔐</div>Acceso por roles</div>
    </div>
  </section>
  <section class="login-panel-right">
    <form class="login-form-box" id="form-auth">
      <h2 id="titulo-auth">Iniciar sesión</h2>
      <p id="subtitulo-auth">Ingresa tu usuario y contraseña.</p>
      <div id="error-msg" class="badge badge-danger" style="display:none;width:100%;padding:10px 14px;border-radius:8px;margin:14px 0" role="alert"></div>
      <div id="grupo-nombre" class="form-group" style="display:none;margin-top:18px">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" maxlength="100" autocomplete="name" />
      </div>
      <div class="form-group" style="margin-top:18px">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" minlength="3" maxlength="30" autocomplete="username" required />
      </div>
      <div class="form-group" style="margin-top:16px">
        <label for="password">Contraseña</label>
        <input type="password" id="password" minlength="8" maxlength="128" autocomplete="current-password" required />
      </div>
      <div id="grupo-confirmacion" class="form-group" style="display:none;margin-top:16px">
        <label for="password-confirmacion">Confirmar contraseña</label>
        <input type="password" id="password-confirmacion" minlength="8" maxlength="128" autocomplete="new-password" />
      </div>
      <button class="btn btn-primary" id="btn-auth" type="submit" style="width:100%;justify-content:center;padding:12px;font-size:15px;margin-top:20px">Iniciar sesión →</button>
      <p style="margin-top:20px;font-size:11.5px;color:var(--gray-400);text-align:center">Proyecto académico SENA · Datos almacenados localmente</p>
    </form>
  </section>
</div>
<div id="toast-container"></div>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
let modoPrimerAdmin = false;

function mostrarError(mensaje) {
  const nodo = document.getElementById('error-msg');
  nodo.textContent = mensaje;
  nodo.style.display = 'block';
}

function configurarModo(primerAdmin) {
  modoPrimerAdmin = primerAdmin;
  document.getElementById('titulo-auth').textContent = primerAdmin ? 'Crear administrador' : 'Iniciar sesión';
  document.getElementById('subtitulo-auth').textContent = primerAdmin
    ? 'Crea la cuenta que administrará esta tienda.' : 'Ingresa tu usuario y contraseña.';
  document.getElementById('grupo-nombre').style.display = primerAdmin ? '' : 'none';
  document.getElementById('grupo-confirmacion').style.display = primerAdmin ? '' : 'none';
  document.getElementById('nombre').required = primerAdmin;
  document.getElementById('password-confirmacion').required = primerAdmin;
  document.getElementById('password').autocomplete = primerAdmin ? 'new-password' : 'current-password';
  document.getElementById('btn-auth').textContent = primerAdmin ? 'Crear administrador →' : 'Iniciar sesión →';
}

async function enviarAuth(event) {
  event.preventDefault();
  const error = document.getElementById('error-msg');
  error.style.display = 'none';
  const nombre = document.getElementById('nombre').value;
  const usuario = document.getElementById('usuario').value;
  const password = document.getElementById('password').value;
  try {
    if (modoPrimerAdmin) {
      if (password !== document.getElementById('password-confirmacion').value) {
        mostrarError('Las contraseñas no coinciden');
        return;
      }
      await window.api.crearPrimerAdmin({ nombre, usuario, password });
    }
    const sesion = await window.api.iniciarSesion({ usuario, password });
    window.location.replace(sesion.rol === 'administrador' ? 'pages/dashboard.html' : 'pages/ventas.html');
  } catch (e) {
    mostrarError(String(e?.message ?? e).replace(/^Error invoking remote method '[^']+': (Error: )?/, ''));
    document.getElementById('password').value = '';
    if (modoPrimerAdmin) document.getElementById('password-confirmacion').value = '';
  }
}

document.getElementById('form-auth').addEventListener('submit', enviarAuth);

(async () => {
  try {
    const hayUsuarios = await window.api.hayUsuarios();
    configurarModo(!hayUsuarios);
    try {
      const sesion = await window.api.obtenerSesion();
      window.location.replace(sesion.rol === 'administrador' ? 'pages/dashboard.html' : 'pages/ventas.html');
    } catch { /* La ausencia de sesión es el estado normal en el formulario. */ }
  } catch (e) {
    configurarModo(false);
    mostrarError(String(e?.message ?? e));
  }
})();
</script>
</body>
</html>
